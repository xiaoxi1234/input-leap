name: Build Windows Release v3.0.3

on:
  workflow_dispatch:

env:
  B_BUILD_TYPE: Release

jobs:
  win-build:
    name: Windows Qt6
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          path: input-leap
          submodules: recursive

      - name: Download Bonjour SDK-like
        id: bonjour
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Force -ItemType Directory -Path .\deps
          Invoke-WebRequest 'https://github.com/nelsonjchen/mDNSResponder/releases/download/v2019.05.08.1/x64_RelWithDebInfo.zip' -OutFile 'deps\BonjourSDKLike.zip'
          Expand-Archive .\deps\BonjourSDKLike.zip -DestinationPath .\deps\BonjourSDKLike
          Remove-Item deps\BonjourSDKLike.zip
          "path=$env:GITHUB_WORKSPACE\deps\BonjourSDKLike" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.2
          target: desktop
          arch: win64_msvc2022_64
          host: windows

      - name: Configure build system
        run: |
          New-Item -Force -ItemType Directory -Path .\build | Out-Null
          cd build
          cmake -S ..\input-leap -G "Visual Studio 17 2022" -A x64 -D CMAKE_BUILD_TYPE=$env:B_BUILD_TYPE `
            -DQT_DEFAULT_MAJOR_VERSION=6 `
            -DINPUTLEAP_VERSION_DESC=release `
            -DDNSSD_LIB="$env:BONJOUR_SDK_HOME\Lib\x64\dnssd.lib" `
            -D CMAKE_INSTALL_PREFIX=input-leap-install
        env:
          BONJOUR_SDK_HOME: ${{ steps.bonjour.outputs.path }}

      - name: Run build system
        run: |
          cmake --build build --config $env:B_BUILD_TYPE --target install --parallel

      - name: Create Archive
        run: Compress-Archive -Path build\input-leap-install\* -DestinationPath InputLeap_3.0.3_windows_qt6.zip

      - name: Build the Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp .\build\installer-inno\input-leap.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: .\build\installer-inno\bin\*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: InputLeap_3.0.3_windows_qt6.zip
          if-no-files-found: error